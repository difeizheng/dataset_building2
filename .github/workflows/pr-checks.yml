name: Pull Request Checks

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]

env:
  JAVA_VERSION: '17'

jobs:
  # ==================== PR 质量检查 ====================
  pr-checks:
    name: PR Quality Checks
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Check for sensitive data
        run: |
          echo "Checking for hardcoded secrets..."
          grep -r -E "(password|secret|api.key|token)\s*=\s*['\"][^'\"]{8,}['\"]" --include="*.java" --include="*.yml" --include="*.yaml" --include="*.properties" . || echo "No hardcoded secrets found"

      - name: Check branch naming
        run: |
          echo "Branch: ${{ github.head_ref }}"
          if [[ "${{ github.head_ref }}" =~ ^agent/ ]]; then
            echo "Agent branch - OK"
          fi

  # ==================== 快速测试（PR 用）====================
  quick-test:
    name: Quick Test (PR)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: 'temurin'
          cache: 'maven'

      # 快速编译检查
      - name: Compile all Java modules
        run: |
          mvn compile -B -q
          cd data-fab && mvn compile -B -q
          cd kb-fab && mvn compile -B -q
          cd ai-fab/ai-fab-gateway && mvn compile -B -q

      # 运行关键单元测试（快速）
      - name: Run critical unit tests
        run: |
          # gov-fab 核心测试
          mvn test -Dtest="*Test" -B -q || true
          # data-fab 核心测试
          cd data-fab && mvn test -Dtest="*Test" -B -q || true

  # ==================== 代码覆盖率检查 ====================
  coverage-check:
    name: Coverage Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: 'temurin'
          cache: 'maven'

      - name: Run data-fab tests with coverage
        run: |
          cd data-fab
          mvn test jacoco:report -B
          echo "Coverage: $(cat target/site/jacoco/jacoco.xml | grep -oP 'Total coverage: \K[0-9.]+%' || echo 'N/A')"

  # ==================== PR 评论状态 ====================
  pr-status:
    name: PR Status
    runs-on: ubuntu-latest
    needs: [pr-checks, quick-test, coverage-check]
    if: always()
    steps:
      - name: PR Status Summary
        run: |
          echo "## PR Checks Summary" >> $GITHUB_STEP_SUMMARY
          echo "| Check | Status |" >> $GITHUB_STEP_SUMMARY
          echo "|-------|--------|" >> $GITHUB_STEP_SUMMARY
          echo "| PR Quality | ${{ needs.pr-checks.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Quick Test | ${{ needs.quick-test.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Coverage | ${{ needs.coverage-check.result }} |" >> $GITHUB_STEP_SUMMARY
