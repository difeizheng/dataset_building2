# DM8 (达梦) Test Profile for data-fab
# 国产化硬约束验证：数据源切换到达梦 DM8
#
# 环境变量（CI runner 注入）：
#   DM8_TEST_HOST     - DM8 主机地址
#   DM8_TEST_PORT     - DM8 端口（默认 5236）
#   DM8_TEST_USERNAME - DM8 用户名
#   DM8_TEST_PASSWORD - DM8 密码

spring:
  datasource:
    driver-class-name: dm.jdbc.driver.DmDriver
    url: jdbc:dm://${DM8_TEST_HOST:localhost}:${DM8_TEST_PORT:5236}/DATA_FAB
    username: ${DM8_TEST_USERNAME:SYSDBA}
    password: ${DM8_TEST_PASSWORD:}
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2
      connection-timeout: 30000
  jpa:
    hibernate:
      ddl-auto: none
    properties:
      hibernate:
        dialect: org.hibernate.dialect.DmDialect
    show-sql: true
  sql:
    init:
      mode: always
      schema-locations: classpath:dm8-schema.sql
      data-locations: classpath:dm8-data.sql

server:
  port: 8080
