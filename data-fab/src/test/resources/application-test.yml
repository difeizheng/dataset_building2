spring:
  datasource:
    url: jdbc:h2:mem:testdb;MODE=DB2;DB_CLOSE_DELAY=-1;DATABASE_TO_UPPER=false;CASE_INSENSITIVE_IDENTIFIERS=true
    username: sa
    password:
    driver-class-name: org.h2.Driver
  jpa:
    hibernate:
      ddl-auto: create-drop
    defer-datasource-initialization: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.H2Dialect
    show-sql: false
  h2:
    console:
      enabled: true
      path: /h2-console

# 国密 SM4 加密配置 (测试用)
sm4:
  encryption:
    key: MTIzNDU2Nzg5MDEyMzQ1Ng==  # Base64("1234567890123456")
