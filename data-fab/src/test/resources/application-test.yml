spring:
  datasource:
    url: jdbc:h2:mem:testdb;MODE=DMDB;DB_CLOSE_DELAY=-1
    username: sa
    password:
    driver-class-name: org.h2.Driver
  jpa:
    hibernate:
      ddl-auto: create-drop
    properties:
      hibernate:
        dialect: org.hibernate.dialect.H2Dialect
    show-sql: true
  h2:
    console:
      enabled: true
      path: /h2-console

# 国密 SM4 加密配置 (测试用)
sm4:
  encryption:
    key: MTIzNDU2Nzg5MDEyMzQ1Ng==  # Base64("1234567890123456")
