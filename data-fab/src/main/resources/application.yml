server:
  port: 8080
  servlet:
    context-path: /

spring:
  application:
    name: data-fab
  # ⚠️ 部署时必须设置以下环境变量，否则应用启动失败
  # DB_USERNAME: 数据库用户名
  # DB_PASSWORD: 数据库密码
  # JWT_SECRET: JWT签名密钥（至少32字符）
  datasource:
    driver-class-name: dm.jdbc.driver.DmDriver
    url: jdbc:dm://${DB_HOST:localhost}:${DB_PORT:5236}/DATA_FAB
    username: ${DB_USERNAME:?must be set}
    password: ${DB_PASSWORD:?must be set}
    hikari:
      maximum-pool-size: 20
      minimum-idle: 5
      idle-timeout: 30000
      connection-timeout: 30000

  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
      timeout: 5000ms

  jackson:
    date-format: yyyy-MM-dd HH:mm:ss
    time-zone: GMT+8
    default-property-inclusion: non_null

mybatis-plus:
  mapper-locations: classpath*:/mapper/**/*.xml
  global-config:
    db-config:
      id-type: assign_id
      logic-delete-field: deleted
      logic-delete-value: 1
      logic-not-delete-value: 0
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.slf4j.Slf4jImpl

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html

logging:
  level:
    root: INFO
    com.ctg.dataFab: DEBUG
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] %-5level %logger{36} - %msg%n"

# JWT配置
jwt:
  secret: ${JWT_SECRET:?must be set}
  expiration: 3600000  # 1小时
  refresh-expiration: 604800000  # 7天

# 数据分级配置
data-classification:
  levels:
    - L1: 公开数据
    - L2: 内部数据
    - L3: 敏感数据
    - L4: 机密数据
