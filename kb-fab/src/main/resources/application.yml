server:
  port: 8082
  servlet:
    context-path: /

spring:
  application:
    name: kb-fab
  # ⚠️ 部署时必须设置以下环境变量，否则应用启动失败
  # DB_USERNAME: 数据库用户名
  # DB_PASSWORD: 数据库密码
  # JWT_SECRET: JWT签名密钥（至少32字符）
  datasource:
    driver-class-name: dm.jdbc.driver.DmDriver
    url: jdbc:dm://${DB_HOST:localhost}:${DB_PORT:5236}/KB_FAB
    username: ${DB_USERNAME:?must be set}
    password: ${DB_PASSWORD:?must be set}
    hikari:
      maximum-pool-size: 20
      minimum-idle: 5
      idle-timeout: 30000
      connection-timeout: 30000

  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
      timeout: 5000ms

  jackson:
    date-format: yyyy-MM-dd HH:mm:ss
    time-zone: GMT+8
    default-property-inclusion: non_null

mybatis-plus:
  mapper-locations: classpath*:/mapper/**/*.xml
  global-config:
    db-config:
      id-type: assign_id
      logic-delete-field: deleted
      logic-delete-value: 1
      logic-not-delete-value: 0
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.slf4j.Slf4jImpl

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html

# Knowledge Base Configuration
kb-fab:
  graph-db:
    type: ${GRAPH_DB_TYPE:uge}
    url: ${GRAPH_DB_URL:http://localhost:7474}
    username: ${GRAPH_DB_USER:}
    password: ${GRAPH_DB_PASS:}
  vector-db:
    type: ${VECTOR_DB_TYPE:proton}
    url: ${VECTOR_DB_URL:http://localhost:8080}
    api-key: ${VECTOR_DB_API_KEY:}
  elasticsearch:
    url: ${ES_URL:http://localhost:9200}
    username: ${ES_USER:}
    password: ${ES_PASS:}
    index-prefix: kb
  retrieval:
    vector-weight: 0.4
    graph-weight: 0.3
    fulltext-weight: 0.3
    top-k: 10
    rerank: true
    timeout-ms: 500
  rag:
    max-context-tokens: 4000
    temperature: 0.7
    model: ${LLM_MODEL:ctg-llm}
  quality:
    completeness-threshold: 0.85
    consistency-threshold: 0.80
    accuracy-threshold: 0.90

logging:
  level:
    root: INFO
    com.ctg.kbFab: DEBUG
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] %-5level %logger{36} - %msg%n"

# JWT Configuration
jwt:
  secret: ${JWT_SECRET:?must be set}
  expiration: 3600000  # 1 hour in milliseconds
